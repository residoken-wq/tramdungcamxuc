services:
  app:
    image: ${APP_IMAGE:-ghcr.io/residoken-wq/tramdungcamxuc}:${APP_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Generate PAYLOAD_SECRET with openssl rand -hex 32}
      DATABASE_URI: postgres://postgres:${POSTGRES_PASSWORD:?Set a hex POSTGRES_PASSWORD}@postgres:5432/tramdungcamxuc
      SITE_URL: ${SITE_URL:-}
      SITE_NOINDEX: ${SITE_NOINDEX:-}
      STYLEGUIDE_PUBLIC: ${STYLEGUIDE_PUBLIC:-}
      CSP_ENFORCE: ${CSP_ENFORCE:-}
      # Forms reject every submission in production without the Turnstile secret.
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Without RESEND_API_KEY emails are only written to the app log.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Without CRON_SECRET /api/cron/expire-orders always answers 401 and pending orders never expire.
      CRON_SECRET: ${CRON_SECRET:-}
      PAYMENT_SANDBOX: ${PAYMENT_SANDBOX:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual}
      SEPAY_WEBHOOK_API_KEY: ${SEPAY_WEBHOOK_API_KEY:-}
      # Paid lesson video stays in sandbox (no real video) until VIDEO_PROVIDER=bunny and both Bunny keys are set.
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-}
      BUNNY_STREAM_LIBRARY_ID: ${BUNNY_STREAM_LIBRARY_ID:-}
      BUNNY_STREAM_TOKEN_KEY: ${BUNNY_STREAM_TOKEN_KEY:-}
      # Optional R2/S3 media storage, used only when all four S3_BUCKET/ENDPOINT/ACCESS_KEY_ID/SECRET_ACCESS_KEY are set.
      # Switching does not move files already in the media volume.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - media:/app/media
      - private:/app/private
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/users/init').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # One-off sample data loader: docker compose ... --profile tools run --rm seed
  seed:
    image: ${APP_IMAGE:-ghcr.io/residoken-wq/tramdungcamxuc}:tools-${APP_TAG:-latest}
    profiles: ['tools']
    restart: 'no'
    environment:
      NODE_ENV: production
      SEED_ALLOW_PROD: 'true'
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Generate PAYLOAD_SECRET with openssl rand -hex 32}
      DATABASE_URI: postgres://postgres:${POSTGRES_PASSWORD:?Set a hex POSTGRES_PASSWORD}@postgres:5432/tramdungcamxuc
    depends_on:
      postgres:
        condition: service_healthy
    command: ['pnpm', 'seed']

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a hex POSTGRES_PASSWORD}
      POSTGRES_DB: tramdungcamxuc
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # TCP check: during first-run initdb the temporary server listens only on
      # the unix socket, so this stays unhealthy until the real server is up.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d tramdungcamxuc']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  pgdata:
  media:
  private:
