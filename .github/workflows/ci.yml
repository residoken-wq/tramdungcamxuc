name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels that PR's older run. Pushes to main are grouped by commit,
# so every merge still gets its own image (sha-<7>) and nothing on main is cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URI: postgres://postgres:postgres_ci_password@localhost:5432/tramdungcamxuc
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  CI: 'true'

jobs:
  # Decides what the PR needs. Docs-only PRs skip tests; the Docker image is built on
  # main, or on a PR only when it touches the image inputs.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          docker=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/* | *.md | .claude/* | .agents/*) ;;
              *) code=true ;;
            esac
            case "$f" in
              Dockerfile | .dockerignore | package.json | pnpm-lock.yaml | next.config.* | docker-compose* | .github/workflows/*) docker=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"
          echo "code=$code docker=$docker"

  checks:
    name: Lint, Typecheck & Unit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: tramdungcamxuc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate random PAYLOAD_SECRET
        run: |
          SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          echo "PAYLOAD_SECRET=$SECRET" >> $GITHUB_ENV

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run Unit Tests (Vitest)
        run: pnpm test

  e2e:
    name: Build & E2E (shard ${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.58 cannot install browsers on.
    runs-on: ubuntu-24.04
    # A shard normally takes ~7 min; anything far longer is a hang, not progress.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: tramdungcamxuc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate random PAYLOAD_SECRET
        run: |
          SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          echo "PAYLOAD_SECRET=$SECRET" >> $GITHUB_ENV

      - name: Install Playwright browsers and dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Database Migrations
        run: pnpm migrate

      # Cloudflare Turnstile official test keys (always pass). Build + e2e only: unit tests
      # rely on the "no key outside production" bypass and must not call Cloudflare.
      - name: Build Next.js and Payload
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: pnpm build

      # Each shard has its own database; every e2e file must stand alone on an empty DB.
      - name: Run E2E Smoke Tests (Playwright)
        env:
          STYLEGUIDE_PUBLIC: 'true'
          # Test-only OTP readout (/api/test-otp). CI e2e ONLY – never set on a server.
          E2E_TEST_HOOKS: '1'
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: pnpm test:e2e --shard=${{ matrix.shard }}/2

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  docker:
    name: Build and Push Docker image
    needs: [changes, checks, e2e]
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (runtime)
        id: meta-runtime
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/residoken-wq/tramdungcamxuc
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image (runtime)
        id: build-runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          # Demo image: repo variable TURNSTILE_SITE_KEY when set, else Cloudflare's always-pass
          # test key so forms work on the noindex demo (server pairs it with the test secret).
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-runtime.outputs.tags }}
          labels: ${{ steps.meta-runtime.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata (tools)
        id: meta-tools
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/residoken-wq/tramdungcamxuc
          flavor: |
            latest=false
          tags: |
            type=raw,value=tools-latest,enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=tools-sha-,format=short

      - name: Build and push Docker image (tools)
        id: build-tools
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          # Demo image: repo variable TURNSTILE_SITE_KEY when set, else Cloudflare's always-pass
          # test key so forms work on the noindex demo (server pairs it with the test secret).
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-tools.outputs.tags }}
          labels: ${{ steps.meta-tools.outputs.labels }}
          cache-from: type=gha

      - name: Write image digest to job summary
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "### Docker Images Published to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Runtime Image**: \`ghcr.io/residoken-wq/tramdungcamxuc\`" >> $GITHUB_STEP_SUMMARY
          echo "  - **Digest**: \`${{ steps.build-runtime.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tools Image**: \`ghcr.io/residoken-wq/tramdungcamxuc\` (target: \`builder\`)" >> $GITHUB_STEP_SUMMARY
          echo "  - **Digest**: \`${{ steps.build-tools.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  # Keeps the old check name so branch protection / merge rules still find one result.
  # Green only when every job that had to run passed (skipped = not needed, e.g. docs-only PR).
  gate:
    name: Lint, Typecheck, Test, Build & E2E
    needs: [changes, checks, e2e, docker]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) echo "A required job ended with: $r"; exit 1 ;;
            esac
          done
