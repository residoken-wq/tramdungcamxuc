name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Lint, Typecheck, Test, Build & E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: tramdungcamxuc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URI: postgres://postgres:postgres_ci_password@localhost:5432/tramdungcamxuc
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      CI: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate random PAYLOAD_SECRET
        run: |
          SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          echo "PAYLOAD_SECRET=$SECRET" >> $GITHUB_ENV

      - name: Install Playwright browsers and dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run Unit Tests (Vitest)
        run: pnpm test

      - name: Run Database Migrations
        run: pnpm migrate

      # Cloudflare Turnstile official test keys (always pass). Build + e2e only: unit tests
      # rely on the "no key outside production" bypass and must not call Cloudflare.
      - name: Build Next.js and Payload
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: pnpm build

      - name: Run E2E Smoke Tests (Playwright)
        env:
          STYLEGUIDE_PUBLIC: 'true'
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: pnpm test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Build and Push Docker image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (runtime)
        id: meta-runtime
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/residoken-wq/tramdungcamxuc
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image (runtime)
        id: build-runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-runtime.outputs.tags }}
          labels: ${{ steps.meta-runtime.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata (tools)
        id: meta-tools
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/residoken-wq/tramdungcamxuc
          flavor: |
            latest=false
          tags: |
            type=raw,value=tools-latest,enable=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=tools-sha-,format=short

      - name: Build and push Docker image (tools)
        id: build-tools
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-tools.outputs.tags }}
          labels: ${{ steps.meta-tools.outputs.labels }}
          cache-from: type=gha

      - name: Write image digest to job summary
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "### Docker Images Published to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Runtime Image**: \`ghcr.io/residoken-wq/tramdungcamxuc\`" >> $GITHUB_STEP_SUMMARY
          echo "  - **Digest**: \`${{ steps.build-runtime.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tools Image**: \`ghcr.io/residoken-wq/tramdungcamxuc\` (target: \`builder\`)" >> $GITHUB_STEP_SUMMARY
          echo "  - **Digest**: \`${{ steps.build-tools.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
